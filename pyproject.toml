[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "drone_3darea"
version = "0.1.0"
description = "3D simulation area for drone path planning under uncertainty: static volumes, terrain, moving traffic, real Greek low-level areas"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Charis Ntakolia" }]
dependencies = ["numpy>=1.24", "matplotlib>=3.7", "requests>=2.28"]

[tool.setuptools]
packages = ["drone_3darea"]

[tool.setuptools.package-data]
drone_3darea = ["data/*.json", "data/terrain/*.json", "data/wind/*.json"]
